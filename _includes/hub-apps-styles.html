<style>
/* ===================================================
   WRITING DESK: best writing apps hub (index, categories, Mac list)
   Extends main.css tokens. Include once per page, after hub-styles.html.
   =================================================== */

.happ-wrap { max-width: 1100px; margin: 0 auto; padding: 0 40px; }

/* ── Disclosure and trust blocks ───────────────────── */
.happ-note {
  max-width: 760px; margin: 0 auto 8px;
  background: var(--purple-faint); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 22px;
  font-size: 14px; line-height: 1.7; color: var(--ink-muted); font-weight: 300;
}
.happ-note strong { color: var(--ink); font-weight: 500; }
.happ-updated { text-align: center; font-size: 12.5px; color: var(--ink-faint); margin-top: 14px; }

/* ── Category chips ────────────────────────────────── */
.happ-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 26px auto 0; max-width: 860px; }
.happ-chip {
  font-size: 13.5px; color: var(--ink-muted); text-decoration: none;
  padding: 8px 16px; border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--white); transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.happ-chip:hover { color: var(--purple); border-color: var(--purple-mid); }
.happ-chip.active { background: var(--purple); border-color: var(--purple); color: white; font-weight: 500; }

/* ── Category pick cards on the hub ────────────────── */
.happ-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.happ-cat {
  display: flex; flex-direction: column; text-decoration: none;
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 22px; transition: box-shadow 0.2s, transform 0.2s;
}
.happ-cat:hover { box-shadow: 0 4px 20px rgba(83,74,183,0.09); transform: translateY(-2px); }
.happ-cat h3 { font-family: var(--serif); font-size: 19px; font-weight: 400; color: var(--ink); line-height: 1.3; margin-bottom: 8px; }
.happ-cat p { font-size: 13.5px; color: var(--ink-muted); font-weight: 300; line-height: 1.6; flex: 1; margin-bottom: 12px; }
.happ-cat span { font-size: 12.5px; font-weight: 500; color: var(--purple); }

/* ── Opinion block on category pages ───────────────── */
.happ-pick { max-width: 700px; margin: 0 auto; }
.happ-pick-label { font-size: 11px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: var(--purple); margin-bottom: 8px; display: block; }
.happ-pick h2 { font-family: var(--serif); font-size: 26px; font-weight: 400; line-height: 1.3; color: var(--ink); margin-bottom: 18px; }
.happ-pick p { font-size: 16.5px; color: var(--ink-muted); font-weight: 300; line-height: 1.85; margin-bottom: 18px; }
.happ-method { font-size: 13.5px !important; color: var(--ink-faint) !important; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 8px; }

/* ── Full card ─────────────────────────────────────── */
.happ-grid { display: grid; grid-template-columns: 1fr; gap: 22px; max-width: 860px; margin: 0 auto; }
.happ-card {
  background: var(--white); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); padding: 26px 28px;
  box-shadow: 0 2px 0 var(--border);
  scroll-margin-top: 80px;
}
.happ-card.is-wd { border-color: var(--purple); background: var(--purple-faint); }
.happ-card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.happ-card-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 400; color: var(--ink); line-height: 1.2; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.happ-tags { font-size: 12px; color: var(--ink-faint); margin-top: 3px; }
.happ-pill { font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: white; background: var(--purple); padding: 3px 10px; border-radius: 999px; }

.happ-logo { width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: var(--white); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.happ-logo img { width: 30px; height: 30px; object-fit: contain; display: block; }
.happ-logo.is-letter { background: var(--purple-light); border-color: transparent; color: var(--purple); font-family: var(--serif); font-size: 20px; }
.happ-row .happ-logo, .happ-logo.sm { width: 36px; height: 36px; border-radius: 8px; }
.happ-row .happ-logo img { width: 24px; height: 24px; }
.happ-row .happ-logo.is-letter { font-size: 16px; }

.happ-overview { font-size: 15.5px; color: var(--ink-muted); font-weight: 300; line-height: 1.75; margin-bottom: 10px; }
.happ-best { font-size: 14px; color: var(--ink); margin-bottom: 16px; }
.happ-best strong { font-weight: 500; }
.happ-macnote { font-size: 13.5px; color: var(--ink-muted); font-weight: 300; line-height: 1.6; margin: -4px 0 16px; padding-left: 12px; border-left: 2px solid var(--purple-mid); }

.happ-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.happ-badge { font-size: 12px; font-weight: 500; color: var(--ink-muted); background: #f3f3f6; border-radius: 6px; padding: 4px 10px; }
.happ-badge small { font-weight: 300; color: var(--ink-faint); font-size: 11px; margin-left: 3px; }
.happ-badge.mac-first { background: var(--purple-light); color: var(--purple); cursor: help; }
.happ-badge.ai { background: #fff6e5; color: #8a5a00; }
.happ-badge.ai.none { background: #eef6f0; color: var(--green); }

.happ-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.happ-fact { padding: 12px 0; }
.happ-fact + .happ-fact { padding-left: 20px; border-left: 1px solid var(--border); }
.happ-fact-label { font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; display: block; }
.happ-fact-value { font-size: 14px; color: var(--ink); line-height: 1.5; }
.happ-fact-sub { font-size: 12px; color: var(--ink-faint); margin-top: 3px; display: block; }

.happ-ticks { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 18px; }
.happ-ticks li { font-size: 13px; color: var(--ink-muted); padding-left: 18px; position: relative; font-weight: 300; }
.happ-ticks li::before { content: "✓"; position: absolute; left: 0; color: var(--purple); font-weight: 500; font-size: 12px; }

.happ-verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 4px; }
.happ-verdict > div { background: #f8f8fb; border-radius: var(--radius); padding: 14px 16px; }
.happ-card.is-wd .happ-verdict > div { background: var(--white); }
.happ-verdict h4 { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.happ-verdict .yes h4 { color: var(--green); }
.happ-verdict .no h4 { color: #a0442a; }
.happ-verdict p { font-size: 13.5px; color: var(--ink-muted); font-weight: 300; line-height: 1.65; }

.happ-links { margin-top: 16px; font-size: 13.5px; }
.happ-links a { color: var(--purple); font-weight: 500; text-decoration: none; }
.happ-links a:hover { text-decoration: underline; text-underline-offset: 2px; }

/* ── Compact row ───────────────────────────────────── */
.happ-list { max-width: 860px; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--white); overflow: hidden; }
.happ-row { display: grid; grid-template-columns: 36px 1.2fr 1.6fr 1.3fr; gap: 16px; align-items: center; padding: 14px 20px; }
.happ-row + .happ-row { border-top: 1px solid var(--border); }
.happ-row h3 { font-family: var(--serif); font-size: 16px; font-weight: 400; color: var(--ink); line-height: 1.3; }
.happ-row-best { font-size: 13px; color: var(--ink-muted); font-weight: 300; line-height: 1.5; }
.happ-row-price { font-size: 12.5px; color: var(--ink-muted); line-height: 1.5; }
.happ-row-price small { display: block; font-size: 11px; color: var(--ink-faint); }
.happ-row .happ-badges { margin: 6px 0 0; gap: 4px; }
.happ-row .happ-badge { font-size: 11px; padding: 2px 7px; }
.happ-row .happ-tagline { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }

/* ── Related links ─────────────────────────────────── */
.happ-related { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 40px; list-style: none; }
.happ-related li { font-size: 14px; padding-left: 16px; position: relative; }
.happ-related li::before { content: "→"; position: absolute; left: 0; color: var(--purple-mid); font-size: 11px; top: 3px; }
.happ-related a { color: var(--purple); text-decoration: underline; text-underline-offset: 2px; }

@media (max-width: 900px) {
  .happ-wrap { padding: 0 24px; }
  .happ-cats { grid-template-columns: 1fr 1fr; }
  .happ-row { grid-template-columns: 36px 1fr; }
  .happ-row-best, .happ-row-price { grid-column: 2; }
  .happ-related { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .happ-cats { grid-template-columns: 1fr; }
  .happ-card { padding: 20px 18px; }
  .happ-facts { grid-template-columns: 1fr; }
  .happ-fact + .happ-fact { padding-left: 0; border-left: none; border-top: 1px solid var(--border); }
  .happ-verdict { grid-template-columns: 1fr; }
}
</style>
