    questions:
      - id: start-new-project
        q: >-
          How do I start a new project?
        a: >-
          There are two ways to get going, depending on where your manuscript
          already lives.

          Starting fresh:

          1. Click Projects, then Create New Project.

          2. Give your project a name. Writing Desk sets up a folder for it
          on your device.

          Bringing in an existing manuscript:

          1. Save your manuscript as a .docx file if it isn't already.

          2. Click Projects, then + Existing Project.

          3. Select your .docx file to link it as a project.

          Either way, we recommend keeping each project in its own folder on
          your device, so all its related files stay organized together.

      - id: project-types
        q: >-
          What's the difference between project types (Novel, Short Story,
          Poem, etc.)?
        a: >-
          Project types are labels only. They help you organize and identify
          your work, but they don't change how the app behaves, whatever type
          you choose, you get the same full set of features.

      - id: project-vs-note
        q: >-
          What's the difference between a project and a Note (unlinked file)?
        a: >-
          A Note is a simple one-off file that isn't linked to a project.
          It's a good fit for story ideas, quick notes, or anything you don't
          need a full project folder for.

      - id: multiple-documents
        q: >-
          Can I add more than one document to a single project?
        a: >-
          Yes. If you're working on a poetry or short story collection, you
          can link multiple files together within the same project.

      - id: where-files-stored
        q: >-
          Where are my files actually stored?
        a: >-
          On your own machine. Writing Desk saves a .docx file plus a
          .wdjson sidecar file alongside it in your project folder.

      - id: move-project-files
        q: >-
          Can I move my project files to a different folder or computer?
        a: >-
          Moving your files out of their original folder breaks the link
          the app uses to find them. If that happens, just click Open
          Existing File and select your manuscript from its new location to
          reconnect it.

      - id: reference-folder
        q: >-
          What is the Reference Folder?
        a: >-
          A single folder for all your story-related notes, screenshots,
          images, and PDFs. Link it from the Resource section and you'll
          have quick access to everything in it from the writing zone.

      - id: the-pad
        q: >-
          What is The Pad?
        a: >-
          A collapsible notes panel that sits alongside your manuscript,
          scoped to the chapter you're working on. You can import your Story
          Plotter notes for the current chapter into it with one click, and
          use it for quick ideas or chapter thoughts as you write.

      - id: pad-sync
        q: >-
          Does The Pad sync with Story Plotter automatically?
        a: >-
          Import runs one way, from Story Plotter into The Pad, and it's
          manual rather than automatic. This keeps your content from
          duplicating across the two.

      - id: resource-centre
        q: >-
          What is the Resource Centre?
        a: >-
          A place to build out characters, locations, and other worldbuilding
          material, with support for images and galleries on character and
          location entries.

      - id: resource-centre-ai
        q: >-
          Are my Resource Centre notes sent to the AI?
        a: >-
          Only fields you've explicitly marked as shareable with AI are ever
          included in an AI request. Anything marked private is never
          transmitted, no matter which AI feature you use.

      - id: import-manuscript
        q: >-
          Can I import a manuscript from Word or Google Docs?
        a: >-
          Yes. Save your file as a .docx from Word or Google Docs, then open
          it with Writing Desk.

      - id: heading-style-import
        q: >-
          What happens if my manuscript uses a different chapter-heading
          style than Writing Desk expects?
        a: >-
          Writing Desk will import most standard formatting from your file,
          but unusual or non-standard heading styles may not carry across
          perfectly. It's worth checking your chapter breaks after import.

  - slug: writing-editing
    name: Writing & Editing
    description: The editor itself, formatting, autosave, version history, and export.
    icon: pencil
    videos:
      - slug: editor-tools
        embed_url: https://embed.app.guidde.com/playbooks/3dBHrJRP7ayykMqNhWsS55?mode=videoOnly
        title: "Editing Your Manuscript with Writing Desk"
        transcript: |-
          0:00 Writing Desk's comprehensive editorial tools are designed to help you refine and improve your manuscript. Here's how.
          0:06 First, there's the Proofreader, which provides spelling, grammar, and style suggestions, including filter words, weak intensifiers, weak adverbs, and repetition.
          0:20 The Analysis dropdown offers additional editorial tools to help you examine your writing style and structure.
          0:27 Open Prose Analysis to review sentence length, passive voice, where you might be telling versus showing, and repeated sentence openings, so you can polish and improve the impact of your writing.
          0:44 Finally, there's the AI Editor. This runs an AI editorial review across four lenses, highlighting the chapter's strengths and potential areas for improvement.
          0:55 For example, here it says the tension drops in the middle of the first chapter, creating an uneven emotional arc.
          1:02 The AI editorial review should never replace human feedback, but it's a good way to get quick insights so you can hone your writing as you go.
          1:12 Additional editorial features include Chapter Variants. A variant creates a second copy of the chapter you can edit side by side, so you can edit boldly without losing the original, for example to try a different point of view.
          1:28 Right-click to rename a variant or promote a variant to active status.
          1:33 There's also full Version History. Click the hamburger menu, go to Version History, and open it to see the last 10 versions of your document, created automatically and periodically as you edit.
          1:47 The final editing tool is Finish Draft. Clicking it creates a draft snapshot saved alongside your manuscript, so you can keep editing knowing your initial draft is saved and reviewable if you ever want to revert.
          2:08 Writing Desk's editorial tools are designed to help you make your manuscript the best it can be, without getting in the way.
          2:15 Download Writing Desk today to take them for a spin.
        guide:
          title: "Editing Your Manuscript: A Step-by-Step Guide"
          intro: >-
            Three layers of feedback, plus the safety net to edit boldly:
            here's how to use Writing Desk's editorial tools together.
          steps:
            - heading: Check spelling and grammar
              text: >-
                Open Proofreader for spelling, grammar, and style
                suggestions, including filter words, weak intensifiers, weak
                adverbs, and repetition.
              image_alt: Proofreader suggestions highlighted inline
            - heading: Open Prose Analysis
              text: >-
                From the Analysis dropdown, open Prose Analysis to review
                sentence length, passive voice, telling versus showing, and
                repeated sentence openings.
              image_alt: The Prose Analysis panel with style metrics
            - heading: Run an AI Editor review
              text: >-
                Open the AI Editor to run a review across four editorial
                lenses, highlighting a chapter's strengths and potential
                areas for improvement.
              image_alt: The AI Editor review panel
            - heading: Read the feedback
              text: >-
                AI Editorial feedback is a good way to get quick insights and
                hone your writing as you go, but it should never replace
                human feedback.
              image_alt: AI Editor feedback on an uneven emotional arc
            - heading: Create a Chapter Variant
              text: >-
                Create a Chapter Variant to edit a second copy of a chapter
                side by side with the original, for example to try a
                different point of view.
              image_alt: A Chapter Variant open side by side with the original
            - heading: Manage variants
              text: >-
                Right-click a variant to rename it or promote it to active
                status.
              image_alt: The right-click menu on a Chapter Variant
            - heading: Open Version History
              text: >-
                Click the hamburger menu, then Version History, to see the
                last 10 versions of your document, saved automatically as
                you edit.
              image_alt: Version History listing the last 10 saved versions
            - heading: Use Finish Draft
              text: >-
                Click Finish Draft to save a snapshot of your manuscript
                alongside your current file, so you can keep editing knowing
                you can always go back.
              image_alt: The Finish Draft confirmation
    questions:
      - id: formatting-options
        q: >-
          What formatting options are available in the editor?
        a: >-
          Headings, bold, italic, underline, strikethrough, highlight,
          alignment, first-line indent, bullet and numbered lists, links,
          tables, blockquotes, line spacing, and adjustable font size.

      - id: new-chapter
        q: >-
          How do I create a new chapter?
        a: >-
          New chapters are defined by H2 headings. Insert an H2 directly, or
          select some text and use Cmd+Opt+2.

      - id: autosave
        q: >-
          Does Writing Desk autosave?
        a: >-
          Yes, Writing Desk autosaves your work every few seconds, and saves
          a new version at the end of each session that you can find in
          Version History.

      - id: version-history
        q: >-
          Can I see the version history of my manuscript?
        a: >-
          Yes. Open Settings, click Version History, then select any dated
          version from the list to open it.

      - id: finish-draft
        q: >-
          What does "Finish Draft" do?
        a: >-
          It saves a copy of your manuscript exactly as it is right now into
          your drafts folder, alongside your current file. That means you
          can keep editing the current version freely, knowing you can always
          revert to that snapshot if you need to.

      - id: chapter-iterations
        q: >-
          What are "chapter variations"?
        a: >-
          Chapter Iterations let you create alternate versions of a chapter
          while keeping the original fully intact, and switch between them
          whenever you like. Edit boldly, without ever losing anything.

      - id: find-replace
        q: >-
          Does Writing Desk support Find & Replace?
        a: >-
          Yes, and you can scope it to the current chapter or the whole
          manuscript.

      - id: focus-mode
        q: >-
          What is Focus Mode?
        a: >-
          A distraction-free writing view that hides all side panels. Press
          Esc to exit.

      - id: font-text-size
        q: >-
          Can I change the writing font or text size?
        a: >-
          Text size is adjustable from the toolbar.

      - id: dark-mode
        q: >-
          Does Writing Desk support dark mode?
        a: >-
          Not yet. It's on the roadmap, but there's no launch date yet.

      - id: insert-images
        q: >-
          Can I insert images into my manuscript?
        a: >-
          Not into the manuscript text itself. You can open image files as
          reference tabs while you write, and add them to character and
          location entries in the Resource Centre.

      - id: export-vs-submission-vs-print
        q: >-
          What's the difference between "Export," "Submission Export," and
          "Print / Save as PDF"?
        a: >-
          Export saves a copy of your manuscript in a new file format.
          Submission Export formats it to Shunn guidelines for submitting to
          agents. Print / Save as PDF uses your Mac's print dialogue to
          print or save a PDF of your manuscript.

  - slug: story-plotter
    name: Story Plotter
    description: Planning and structuring your story across Doc, Board, and Timeline views.
    icon: map
    videos:
      - slug: plotter
        embed_url: https://embed.app.guidde.com/playbooks/51ZYBXJLtkpdvahUpHKJrD?mode=videoOnly
        title: "Organize and Map Your Novel Using Writing Desk's Story Plotter"
        transcript: |-
          0:00 Use Writing Desk's Story Plotter to organize and map your novel's chapters and narrative threads.
          0:05 To get started, open your manuscript, then expand the left-hand sidebar and click Story Plotter at the bottom.
          0:13 Here you can add chapter summaries and scene-by-scene breakdowns for each of your chapters, with as little or as much detail and structure as you like.
          0:22 Match the chapter title in Story Plotter to the title in your manuscript to import chapter notes into your Pad for each chapter with a click, so your chapter notes are always there when you need them, but never in the way.
          0:37 The Pad is a free-form area where you can brain dump without structure.
          0:41 There are two additional views. First, the Board view.
          0:46 Here you can map chapters and scenes against any of 11 different story structures.
          0:51 If we click Save the Cat, you'll see it lays out the Save the Cat story beats broken out across three acts.
          0:59 Drag and drop chapters and scenes as needed until you're happy with your story's pacing.
          1:07 The final view is the Timeline, where you can track all the narrative threads for your story.
          1:15 Click to expand the chapter summary and add each thread you want to track below it, whether that's a relationship, the main plot, or a plant-and-payoff moment.
          1:27 It highlights open threads so you can see whether they've been fully developed and resolved, or left half-baked and dangling.
          1:34 Click an empty space to add a new thread card with a title, description, and tag, so you can track multiple threads and complex plotlines with ease.
          1:46 Add as many or as few cards as you need.
          1:49 Give your novel as much or as little structure as you like, and keep everything in one place with Writing Desk's Story Plotter.
        guide:
          title: "How to Use Story Plotter: A Step-by-Step Guide"
          intro: >-
            Story Plotter has three linked views, Doc, Board, and Timeline, for
            planning and structuring your novel. Here's how to get started with
            each one.
          steps:
            - heading: Open Story Plotter
              text: >-
                Open your manuscript, then expand the left-hand sidebar and click
                Story Plotter at the bottom.
              image_alt: The Story Plotter link in the left-hand sidebar
            - heading: Add your chapter summaries
              text: >-
                In the Doc view, add chapter summaries and scene-by-scene
                breakdowns for each of your chapters, with as little or as much
                detail and structure as you like.
              image_alt: A chapter summary and scene breakdown in the Doc view
            - heading: Import notes into The Pad
              text: >-
                Match the chapter title in Story Plotter to the title in your
                manuscript, then import chapter notes into The Pad for that
                chapter with a click. Your chapter notes stay close at hand when
                you're writing, but out of the way when you're not.
              image_alt: Importing a chapter's Story Plotter notes into The Pad
            - heading: Switch to the Board view
              text: >-
                Open the Board view to map chapters and scenes against any of 11
                built-in story structures.
              image_alt: The Board view with a story structure template applied
            - heading: Apply a structure template
              text: >-
                Select a template, for example Save the Cat, and Story Plotter
                lays out its story beats across three acts.
              image_alt: Save the Cat story beats broken out across three acts
            - heading: Arrange your pacing
              text: >-
                Drag and drop chapters and scenes on the Board until you're happy
                with your story's pacing.
              image_alt: Dragging a scene card between acts on the Board
            - heading: Switch to the Timeline view
              text: >-
                Open the Timeline view to track every narrative thread running
                through your story.
              image_alt: The Timeline view showing chapters and threads
            - heading: Track a thread
              text: >-
                Click to expand a chapter summary and add each thread you want to
                track below it, whether that's a relationship, the main plot, or
                a plant-and-payoff moment.
              image_alt: Adding a narrative thread beneath a chapter summary
            - heading: Spot dangling threads
              text: >-
                Open threads are highlighted, so you can see at a glance whether
                they've been fully developed and resolved, or left half-baked and
                dangling.
              image_alt: A highlighted open thread on the Timeline
            - heading: Add a new thread card
              text: >-
                Click an empty space to add a new thread card with a title,
                description, and tag, so you can track multiple threads and
                complex plotlines with ease.
              image_alt: Creating a new thread card with a title and tag
    questions:
      - id: what-is-story-plotter
        q: >-
          What is Story Plotter?
        a: >-
          A structural planning tool with three linked views: a document
          outline view, a visual Board view, and a causality-focused Timeline
          view.

      - id: board-vs-timeline
        q: >-
          What's the difference between the Board and Timeline views?
        a: >-
          The Board organizes chapters into acts and structure using
          story-structure templates. The Timeline tracks narrative threads
          across chapters as a causality audit tool, it never generates
          content, only visualizes what you've already written.

      - id: structure-templates
        q: >-
          How many structure templates are available?
        a: >-
          11 built-in structure templates, plus an option to auto-assign
          your chapters to a 3-act structure.

      - id: plotter-generate-plot
        q: >-
          Can Story Plotter write or generate plot points for me?
        a: >-
          No. The Timeline in particular is explicitly a causality audit
          tool, not a generative one. It never creates or suggests plot
          content.

      - id: chapter-deleted-threads
        q: >-
          What happens to my Story Plotter threads if I delete a chapter?
        a: >-
          Cards on a deleted chapter automatically shift to the nearest
          surviving chapter, and you'll see a dismissible notice so you know
          it happened.

      - id: timeline-create-delete-chapters
        q: >-
          Can I create or delete chapters from the Timeline view?
        a: >-
          No. Timeline can only reorganize and visualize existing chapters.
          Creating or deleting chapters happens in the Doc or Board views.

      - id: seed-develop-complication-payoff
        q: >-
          What do the Seed / Develop / Complication / Payoff tags mean?
        a: >-
          They track the life of a narrative thread, whether it's a
          relationship, a piece of foreshadowing, or a red herring, from
          when it's first planted, through development, complication, and
          resolution. Tracking these on the Timeline helps make sure nothing
          gets left dangling, however complicated your plot gets.

  - slug: export-formatter
    name: Export & The Formatter
    description: Exporting your manuscript and typesetting it into a finished book with the Formatter.
    icon: book
    videos:
      - slug: exporting
        embed_url: https://embed.app.guidde.com/playbooks/nB8gW9FMPp37wKhM4NouzM?mode=videoOnly
        title: "Exporting and Formatting Manuscripts with Writing Desk"
        transcript: |-
          0:00 With Writing Desk you can export your manuscript in multiple formats, ready for agent submissions or for self-publishing.
          0:07 What do you do when you finish your manuscript? Writing Desk gives you a few different options.
          0:14 The first is exporting as one of these formats: .docx, .md, .txt, or PDF.
          0:24 If you download as a PDF, it uses the print dialogue, and you save that to your device.
          0:31 You can also use the agent-ready Submission Export. Add your name and contact details, the manuscript title, and total word count.
          0:45 Then choose the font, page size, and how many chapters or total word count, and click Export as .docx.
          0:52 This uses standardised formatting, so your document is ready for submission in moments.
          1:03 Finally, there's a professional typesetting and formatting feature.
          1:08 Click Typeset and this opens the Formatter in your browser, automatically uploading your manuscript.
          1:15 Here you can design and format your novel for print and EPUB.
          1:21 Set the front and back matter details, then use the designer to select the font, heading size, and more.
          1:26 When you're ready, click Export, and your EPUB and print-ready PDF download to your device.
          1:33 And that's how to export, typeset, and prepare your manuscript for print and agent submissions with Writing Desk.
        guide:
          title: "Exporting and Formatting Manuscripts: A Step-by-Step Guide"
          intro: >-
            Writing Desk gives you three ways to get a finished manuscript out
            into the world: a quick export, an agent-ready submission format, or
            a fully typeset book through the Formatter. Here's how to use each
            one.
          steps:
            - heading: Choose your export format
              text: >-
                From the Export menu, choose .docx, Markdown, plain text, or PDF.
              image_alt: The Export menu with format options
            - heading: Save a PDF
              text: >-
                PDF export uses your Mac's print dialogue. Choose Save as PDF and
                pick where to save it on your device.
              image_alt: The print dialogue saving a manuscript as PDF
            - heading: Open Submission Export
              text: >-
                For agent submissions, open Submission Export and add your name,
                contact details, manuscript title, and total word count.
              image_alt: The Submission Export form with author and manuscript details
            - heading: Set your formatting options
              text: >-
                Choose your font, page size, and whether to show chapters by
                number or total word count.
              image_alt: Submission Export formatting options
            - heading: Export as .docx
              text: >-
                Click Export as .docx. Writing Desk applies standardised Shunn
                manuscript formatting automatically, ready to submit.
              image_alt: A completed Shunn-formatted manuscript export
            - heading: Open the Formatter
              text: >-
                For a fully typeset book, click Typeset. This opens the Formatter
                in your browser and uploads your manuscript automatically.
              image_alt: Launching the Formatter from Writing Desk
            - heading: Design your book
              text: >-
                In the Formatter, set your front and back matter details, then
                use the designer to choose font, heading size, and more.
              image_alt: The Formatter design screen with live page preview
            - heading: Export EPUB and PDF
              text: >-
                When you're happy with the design, click Export. Your EPUB and
                print-ready PDF download to your device, ready to publish.
              image_alt: The Formatter export screen with EPUB and PDF ready to download
    questions:
      - id: export-formats
        q: >-
          What file formats can I export to?
        a: >-
          From the desktop app: .docx, Markdown, plain text, and a
          submission-standard manuscript format. From the Formatter: EPUB
          and print-ready PDF.

      - id: what-is-formatter
        q: >-
          What is the Formatter?
        a: >-
          A companion web app for professional book typesetting. It turns
          your manuscript into a properly designed, print- and e-book-ready
          file, with a range of customizable design options.

      - id: formatter-separate-account
        q: >-
          Do I need a separate account for the Formatter?
        a: >-
          No, use the same login for both the desktop app and the Formatter.

      - id: edit-in-formatter
        q: >-
          Can I edit my chapter text inside the Formatter?
        a: >-
          No, chapter body text is read-only in the Formatter by design. Fix
          typos back in Writing Desk, then re-upload to the Formatter.

      - id: why-read-only
        q: >-
          Why is chapter text read-only in the Formatter?
        a: >-
          To keep one source of truth for your manuscript. Writing Desk is
          where your text lives and gets edited; the Formatter is where it
          gets designed and typeset.

      - id: trim-size
        q: >-
          What trim size does the Formatter use?
        a: >-
          A fixed 5x8 inch trim size.

      - id: epub-pdf-separate
        q: >-
          Can I export just an EPUB without a PDF, or vice versa?
        a: >-
          Yes, EPUB and PDF export together as a bundle, or you can export
          either one individually.

      - id: ready-for-kdp
        q: >-
          Is my exported book ready to submit to a print-on-demand service
          like Amazon KDP or IngramSpark?
        a: >-
          Yes. Once it's typeset and formatted, you can upload your PDF and
          EPUB files to most major self-publishing platforms.

      - id: beta-readers-formatter
        q: >-
          Can beta readers see my manuscript through the Formatter?
        a: >-
          Not yet. A beta reader and feedback feature is planned, but there's
          no launch date yet.

  - slug: editorial-ai
    name: Editorial AI Suite
    description: Proofreader, Chapter Review, Prose Analysis, Manuscript Review, and the AI Editor chat.
    icon: sparkle
    videos:
      - slug: ai-editor
        embed_url: https://embed.app.guidde.com/playbooks/1MiQDiGePjK6VFU7jec5w2?mode=videoOnly
        title: "Exploring AI Editorial Review Features in Writing Desk"
        transcript: |-
          0:00 Writing Desk's AI Editorial Review gives you fast, structured feedback on a chapter-by-chapter basis.
          0:06 Along with the Research Assistant, Writing Desk uses AI for fast editorial feedback when you need it.
          0:13 Select Analysis and click Editor.
          0:19 Select Analyse, and the review panel analyses your prose across four editorial lenses, looking for strengths and areas for improvement.
          0:29 Here, the protagonist is too passive. We need to think about how to make him more active.
          0:35 Writing Desk doesn't rewrite your prose or tell you how to fix it. It highlights areas you might want to focus on.
          0:43 You can ask follow-up questions in the chat to dig deeper into the feedback.
          0:49 The core issue here is the protagonist spends most of the chapter reacting to external events.
          0:56 It's important to recognise that Writing Desk's AI feedback will never replace human feedback.
          1:02 But it's a good way to get quick editorial notes, so you can polish your writing as you go.
          1:09 Download Writing Desk today to try the AI Editorial feature.
        guide:
          title: "Using AI Editorial Review: A Step-by-Step Guide"
          intro: >-
            The AI Editor gives you fast, structured feedback on a chapter, across
            four editorial lenses, without ever rewriting your prose for you.
            Here's how to run a review and get the most out of it.
          steps:
            - heading: Open the Editor
              text: >-
                Select Analysis, then click Editor.
              image_alt: The Analysis menu with Editor selected
            - heading: Run the review
              text: >-
                Click Analyse. The review panel checks your chapter across four
                editorial lenses and surfaces strengths and areas to improve.
              image_alt: The AI Editor review panel analysing a chapter
            - heading: Read the feedback
              text: >-
                Feedback highlights specific areas to focus on, for example a
                protagonist who's too passive, without rewriting your prose or
                telling you exactly how to fix it.
              image_alt: AI Editor feedback highlighting a passive protagonist
            - heading: Dig deeper in the chat
              text: >-
                Ask follow-up questions in the chat to understand any point the
                review raises in more detail.
              image_alt: A follow-up question in the AI Editor chat
            - heading: Use it as a starting point
              text: >-
                Treat the feedback as quick editorial notes to polish your
                writing as you go, not a replacement for a human editor.
              image_alt: The AI Editor chat with a follow-up exchange
      - slug: research-assistant
        embed_url: https://embed.app.guidde.com/playbooks/cw5FQ5vxQBoEtGzeAxsCLw?mode=videoOnly
        title: "Stay Focused with Writing Desk's Research Assistant"
        transcript: |-
          0:00 Writing Desk's Research Assistant helps you avoid distractions by providing quick, accurate research responses in the app.
          0:07 Avoid rabbit holes with the Research Assistant. Click the small search icon, bottom left.
          0:12 Ask anything and get a quick response based on your question in moments.
          0:22 If you want more information, click Go Deeper.
          0:26 Going deeper runs a full web search and pulls out a researched, sourced answer for your question.
          0:32 Stay focused with Writing Desk's Research Assistant.
        guide:
          title: "Using the Research Assistant: A Step-by-Step Guide"
          intro: >-
            Quick, sourced answers without leaving your manuscript or falling
            down a research rabbit hole.
          steps:
            - heading: Open the Research Assistant
              text: >-
                Click the small search icon, bottom left.
              image_alt: The Research Assistant search icon in the editor
            - heading: Ask your question
              text: >-
                Ask anything and get a quick response in moments.
              image_alt: A quick response in the Research Assistant panel
            - heading: Go deeper if you need more
              text: >-
                Click Go Deeper to run a full web search and pull out a
                researched, sourced answer.
              image_alt: A sourced, in-depth answer after clicking Go Deeper
            - heading: Get back to writing
