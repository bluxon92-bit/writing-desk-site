              image_alt: Returning to the manuscript after a Research Assistant query
    questions:
      - id: editorial-ai-tools
        q: >-
          What editorial AI tools does Writing Desk offer?
        a: >-
          Four options from the Analysis menu: Proofreader for spelling and
          grammar, Editor for AI Chapter Review, Prose for client-side prose
          analysis, and Manuscript for full-novel review.

      - id: proofreader-vs-prose-analysis
        q: >-
          What's the difference between Proofreader and Prose Analysis?
        a: >-
          Proofreader handles spelling and grammar through LanguageTool, plus
          a Style tab covering filter words, weak intensifiers, adverb
          density, and repeated physical beats. Prose Analysis is a separate,
          fully local tool covering sentence-length variety, passive voice,
          telling versus showing, repeated openings, paragraph length,
          dialogue percentage, and reading ease, with no AI involved and no
          credit cost.

      - id: prose-analysis-cost
        q: >-
          Does Prose Analysis use AI or cost credits?
        a: >-
          No, it's entirely local, pattern-based analysis. It's free and
          instant.

      - id: four-chapter-review-modes
        q: >-
          What are the four Chapter Review modes?
        a: >-
          Developmental, covering structure, pacing, arcs, and scene
          purpose. Line Editor, covering repetition, crutch words, dialogue,
          and clarity. Beta Reader, covering emotional response, engagement,
          and confusion. And World Editor, covering lore consistency,
          worldbuilding, and magic logic.

      - id: chapter-review-charged-separately
        q: >-
          Do I get charged separately for each of the four Chapter Review
          modes?
        a: >-
          No, all four run from a single combined request and a single
          credit charge.

      - id: chapter-review-cost
        q: >-
          How much does a Chapter Review cost?
        a: >-
          A typical 4,000-word chapter costs 4 credits, and it scales from
          there with chapter length.
        link: /pricing/
        link_text: See full pricing

      - id: cached-reviews
        q: >-
          Does Writing Desk remember my previous Chapter Review results?
        a: >-
          Yes. Results are cached per chapter and reused until you've edited
          the chapter significantly, so you're not charged again just to
          view the same analysis.

      - id: significant-editing-threshold
        q: >-
          What counts as "significant" editing that invalidates a cached
          review?
        a: >-
          Enough that the previous review no longer reflects your current
          draft. Small tweaks won't trigger a new charge, but a meaningful
          rewrite of the chapter will.

      - id: ai-editor-chat
        q: >-
          What is the AI Editor chat?
        a: >-
          A conversational chat with the AI about your current chapter, with
          context carried across the conversation as you go.

      - id: ai-editor-chat-cost
        q: >-
          How much does an AI Editor chat message cost?
        a: >-
          1 credit per message.

      - id: research-assistant
        q: >-
          What is the Research Assistant?
        a: >-
          An AI research tool for background and worldbuilding questions.
          Your initial question is answered without a web search; it only
          searches the web when you explicitly choose to "go deeper."

      - id: manuscript-review
        q: >-
          What is Manuscript Review?
        a: >-
          A full-novel-level AI review that looks across your whole
          manuscript rather than one chapter at a time, surfacing feedback on
          things like character consistency, character motivation, and
          broader developmental notes on structure and pacing. As with all of
          Writing Desk's AI features, it's meant as fast, high-level guidance
          to sit alongside your own judgment, not a replacement for human
          feedback.

      - id: trust-ai-suggestions
        q: >-
          Can I trust the AI's suggestions completely?
        a: >-
          No. AI models can sometimes get things wrong. Use your own
          knowledge, judgment, and instincts alongside any AI editorial
          feedback. It's meant as fast, high-level guidance, not a
          replacement for human feedback.

  - slug: writing-tracker
    name: Writing Tracker
    description: Tracking your sessions, pace, and progress toward your goals.
    icon: bars
    questions:
      - id: what-tracker-measures
        q: >-
          What does the Writing Tracker measure?
        a: >-
          Session word counts and time spent, your writing velocity, your
          most productive times of day, and your progress against daily and
          manuscript-level goals.

      - id: target-completion-date
        q: >-
          Can I set a target completion date for my manuscript?
        a: >-
          Yes. Set a word-count goal and a target date, and the tracker
          calculates the pace you need to hit it.

      - id: tracker-multiple-projects
        q: >-
          Does the Writing Tracker work across multiple projects?
        a: >-
          No, the tracker follows each project independently.

  - slug: account
    name: Account
    description: Creating, managing, and deleting your Writing Desk account.
    icon: user
    questions:
      - id: create-account
        q: >-
          How do I create an account?
        a: >-
          Download the app, then create an account with your email and
          password. Once you're logged in, the app keeps you signed in on
          that device. The same login also works on the Formatter web app.

      - id: account-required
        q: >-
          Can I use Writing Desk without creating an account?
        a: >-
          No, an account is required.

      - id: reset-password
        q: >-
          How do I reset my password?
        a: >-
          1. Open the hamburger menu and select Settings.

          2. Click Reset Password.

          3. Check your email and follow the link.

          If you're logged out, you can start the same process from the
          Reset Password link beneath the login form.

      - id: multiple-macs
        q: >-
          Can I use Writing Desk on more than one Mac?
        a: >-
          Yes, there's no limit on the number of devices you can use Writing
          Desk on.

      - id: delete-account
        q: >-
          How do I delete my account?
        a: >-
          Go to Settings and select Delete Account. This erases your account
          details and anything you've uploaded to the Formatter. It doesn't
          touch any files on your own device.

  - slug: pricing-billing
    name: Pricing, Credits & Billing
    description: Plans, credits, top-ups, and managing your subscription.
    icon: card
    questions:
      - id: what-does-it-cost
        q: >-
          What does Writing Desk cost?
        a: >-
          There's a Free tier, plus Premium and Pro paid plans.
        link: /pricing/
        link_text: View full pricing

      - id: free-tier
        q: >-
          What can I do on the Free tier?
        a: >-
          See the pricing page for exactly what's included.
        link: /pricing/
        link_text: View full pricing

      - id: what-are-credits
        q: >-
          What are "credits" and what do they pay for?
        a: >-
          Credits are spent on AI-powered features: Chapter Review, AI Editor
          chat messages, Research Assistant queries, and Manuscript Review.
          Writing, formatting, Story Plotter, and Prose Analysis never cost
          credits.

      - id: credits-rollover
        q: >-
          Do unused credits roll over month to month?
        a: >-
          Top-up credits never expire. Credits included in your plan refresh
          each month and don't carry over.

      - id: buy-extra-credits
        q: >-
          Can I buy extra credits without upgrading my plan?
        a: >-
          Yes. Top-up packs are available: 120 credits for £5, 300 credits
          for £10, or 600 credits for £20.

      - id: topup-credits-cancel
        q: >-
          What happens to my top-up credits if I downgrade or cancel my
          subscription?
        a: >-
          Top-up credits never expire, so they stay available either way.

      - id: switch-premium-pro
        q: >-
          Can I switch between Premium and Pro at any time?
        a: >-
          Yes, upgrading and downgrading is quick and can be done from the
          billing page in the app.

      - id: cancel-subscription
        q: >-
          How do I cancel my subscription?
        a: >-
          1. Open the hamburger menu and select Billing.

          2. Select Manage My Subscription.

          3. Follow the prompts to cancel.

      - id: manuscripts-after-cancel
        q: >-
          What happens to my manuscripts if I cancel my subscription?
        a: >-
          Your manuscript stays yours and stays on your device. After
          cancelling, you can keep using Writing Desk's free version, or open
          your manuscript in a different app and carry on from there. Your
          work is always yours.

      - id: refunds
        q: >-
          Do you offer refunds?
        a: >-
          We look at refund requests case by case. Contact
          help@writingdeskapp.com and we'll take a look.

      - id: annual-discount
        q: >-
          Is there a discount for annual billing?
        a: >-
          Yes, annual plans are 20% cheaper than paying monthly.

      - id: student-discounts
        q: >-
          Do you offer student, non-profit, or other discounts?
        a: >-
          No.

      - id: update-payment-method
        q: >-
          How do I update my payment method or view past invoices?
        a: >-
          Through the Stripe Customer Portal, accessible from Account
          Settings.

  - slug: privacy-ai
    name: Privacy & AI
    description: How Writing Desk's AI works, and what does (and doesn't) leave your machine.
    icon: shield
    questions:
      - id: ai-writes-prose
        q: >-
          Does Writing Desk's AI write my prose for me?
        a: >-
          No. Writing Desk's AI assists editorially, with feedback, analysis,
          and suggestions, but it never generates or writes your prose for
          you.

      - id: manuscript-leave-computer
        q: >-
          Does my manuscript ever leave my computer?
        a: >-
          Your manuscript is stored locally. You can back it up to iCloud or
          Google Drive if you like, but Writing Desk never uploads or backs
          up your file on your behalf, so it stays under your control.

          The one exception is the Formatter. Since it runs in your browser,
          you'll need to upload your manuscript to use it, and you can delete
          it at any time.

      - id: what-data-sent-to-ai
        q: >-
          What data is sent to the AI when I use an editorial feature?
        a: >-
          Writing Desk calls the Anthropic API transiently, sending your
          chapter content and any resource notes you've marked as shareable
          for context, and receives an answer back. Nothing is stored on our
          side.

      - id: ai-training
        q: >-
          Is my manuscript used to train AI models?
        a: >-
          No. Nothing is stored or used to train AI models at any point.
          Your writing is your own, and every AI call is transient.

      - id: which-ai-model
        q: >-
          Which AI model powers Writing Desk's editorial features?
        a: >-
          The Anthropic API.

      - id: use-without-ai
        q: >-
          Can I use Writing Desk entirely without AI?
        a: >-
          Yes.

      - id: how-different-from-ai-writers
        q: >-
          How is this different from AI writing tools that generate my story
          for me?
        a: >-
          Writing Desk will never generate prose on your behalf. Its AI
          features give you high-level, structural, editorial feedback to
          help you spot what you can't see anymore in your own draft, so you
          can improve your prose your way.

  - slug: technical-troubleshooting
    name: Technical & Troubleshooting
    description: Offline behaviour, manuscript limits, and getting help.
    icon: wrench
    questions:
      - id: grammar-offline
        q: >-
          Does grammar checking work offline?
        a: >-
          Yes.

      - id: max-manuscript-length
        q: >-
          Is there a maximum manuscript length Writing Desk can handle?
        a: >-
          No.

      - id: report-bug
        q: >-
          I found a bug, how do I report it?
        a: >-
          Contact help@writingdeskapp.com to report bugs and get assistance.

      - id: get-help
        q: >-
          Where can I get help if I'm stuck?
        a: >-
          Contact help@writingdeskapp.com and we'll help you out.
