    questions:
      - id: what-is-writing-desk
        q: >-
          What is Writing Desk?
        a: >-
          Writing Desk is a desktop writing app for creative writers. It brings
          together story planning, distraction-free drafting, editorial review,
          and manuscript typesetting in one place, so you can go from a blank
          page to a submission-ready manuscript without leaving the app.

      - id: who-is-it-for
        q: >-
          Who is Writing Desk for?
        a: >-
          Writers at any stage. Whether you want a distraction-free space to
          get a first draft down, or you're polishing a finished manuscript
          ahead of publishing, Writing Desk is built around your process.

      - id: platforms
        q: >-
          What platforms does Writing Desk run on?
        a: >-
          The writing, planning, and editing tools currently run on macOS
          only. The typesetting and formatting tools are available separately
          through the online Formatter, which works in any browser.

      - id: windows-version
        q: >-
          Is a Windows version coming?
        a: >-
          It's on the roadmap, but there's no launch date yet.

      - id: internet-required
        q: >-
          Do I need an internet connection to use Writing Desk?
        a: >-
          No, you can write fully offline. A few features need a connection:
          the Research Assistant, AI editorial review, and the online
          Formatter.

      - id: first-launch
        q: >-
          What do I see when I first open Writing Desk?
        a: >-
          Three options: open an existing project, create a new file, or
          open a file already on your device. If this is your first time,
          Create a New File or setting up a project is the place to start.

      - id: quick-start-project
        q: >-
          What's the quickest way to get started with my first project?
        a: >-
          Select Projects, then Create New Project. Choose novel, short
          story, or poetry, add a title and target word count, then click
          Create. Writing Desk sets up a folder for your manuscript and
          takes you straight into the editor.
        link: /help/projects-organization/
        link_text: More on creating and organizing projects

      - id: open-existing-manuscript
        q: >-
          How do I open a manuscript I've already started?
        a: >-
          From the start screen, select Projects to see your existing
          projects, or Open a File to browse for a manuscript on your
          device. Opening a project takes you straight into the editor,
          with your manuscript front and centre.

      - id: editor-tour
        q: >-
          What am I looking at once I'm in the editor?
        a: >-
          Your manuscript sits front and centre. The left-hand sidebar
          connects your resources, lets you navigate chapters, and holds
          The Pad for chapter notes, Story Plotter lives there too. Top
          right shows your Writing Tracker. Analysis opens the editorial
          tools, and the hamburger menu, top left, has your export options.

      - id: start-writing-first-chapter
        q: >-
          How do I start writing my first chapter?
        a: >-
          New chapters are created with an H2 heading, or the shortcut
          Cmd+Opt+2. Just start typing, Writing Desk autosaves as you go.

      - id: plan-before-write
        q: >-
          Should I plan with Story Plotter before I start writing, or just
          start writing?
        a: >-
          Whichever suits you. Story Plotter is there if you want to map
          chapters and threads first, but nothing stops you from opening a
          blank page and writing straight away. Add structure whenever it's
          useful, not because you have to.

      - id: distraction-free-start
        q: >-
          How do I get straight into a distraction-free writing session?
        a: >-
          Hit Focus Mode to hide the sidebars and get down to writing
          immediately. One click to enter, Esc to exit.

