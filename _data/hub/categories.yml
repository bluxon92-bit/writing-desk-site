index:
  page: Hub index
  url: /best-writing-apps/
  h1: Best Writing Apps
  title: 'Best Writing Apps in 2026: Prices, Platforms and Verdicts'
  meta: A writer's guide to writing apps for novels, essays, blogging and editing, with platforms, prices and honest verdicts.
  for_whom: Anyone choosing a tool for a novel, essay, article or edit.
  pick: 'Depends on the job: see each category'
  why: I write fiction, and I make Writing Desk, so I have a stake in this list. I wrote my own novels in Google Docs, Word, Scrivener, Ulysses and Obsidian, and none of them did everything I needed, which is why I built Writing Desk. This hub covers the tools I would look at for a novel, an essay, a Markdown workflow, an edit or a blog. Writing Desk is first wherever it appears, and every other app gets the same card, the same checks and a real reason to skip it. Start with the category that matches the job, then use the full comparisons for the apps that make your shortlist.
  method: Each app is checked against its own pages for platforms, price and AI stance, and prices carry the date I checked them. I have used Google Docs, Word, Scrivener, Ulysses and Obsidian for my own writing; the rest are assessed from vendor pages and published reviews.
  runner_ups:
  - See each category
  primary_keyword: best writing apps
novels:
  page: Novel writing
  url: /best-writing-apps/novels/
  h1: Best Novel Writing Software
  title: Best Novel Writing Software in 2026
  meta: Planning, drafting, formatting and AI-assisted tools for novelists, compared on platforms, price and who each one suits.
  for_whom: Novelists planning, drafting, formatting and revising a book-length manuscript.
  pick: Writing Desk (on a Mac)
  why: 'My pick is Writing Desk, with the obvious bias: I built it. It keeps the manuscript on your Mac and gives you Story Plotter with 11 structure templates, a Story Board, a Timeline and a Resource Hub for characters, locations, lore and factions. Proofreader and Prose Analysis run locally, and the AI gives editorial feedback on chapters and leaves the prose to you. If you write on Windows, Scrivener is the better fit, with a deep binder, a powerful Compile system and a one-off price. Dabble suits writers who want a friendly cloud app with a Plot Grid and co-authoring. Novelcrafter gives you a wiki-style Codex and a choice of AI models, and Sudowrite leans furthest into AI drafting. For turning a finished manuscript into a book, Atticus, Vellum and Reedsy Studio take different routes: a lifetime licence, a Mac-only polish, and a free browser tool.'
  method: Every app is checked against the vendor's own pages for platforms, price, AI stance and features, with the date shown. I wrote my own novels in Google Docs, Word, Scrivener, Ulysses and Obsidian; I assess the others from their sites and published reviews.
  runner_ups:
  - Scrivener
  - Dabble
  - Novelcrafter
