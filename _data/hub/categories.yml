novels:
  page: Novel writing
  url: /best-writing-apps/novels/
  h1: Best Novel Writing Software
  title: Best Novel Writing Software in 2026
  meta: Planning, drafting, formatting and AI-assisted tools for novelists, compared on platforms, price and who each one suits.
  for_whom: Novelists planning, drafting, formatting and revising a book-length manuscript.
  pick: Writing Desk (on a Mac)
  why: |-
    I built Writing Desk, so weigh my pick with that in mind. It is a Mac app that keeps your manuscript on your machine, with planning, a Resource Hub and editing tools built in. It is flexible too: it opens, drafts and edits Markdown and Word files, so it works for short stories, blogs and essays as well as novels.
 
    * Story Plotter with 11 structure templates
    * Story Board and Timeline to see the whole book at once
    * Resource Hub for characters, locations, lore and factions
    * Proofreader and Prose Analysis that run locally
    * AI for developmental feedback, which never writes prose for you
 
    **Pick something else if you want…**
 
    * Windows: Scrivener, with a deep binder, a powerful Compile system and a one-off price
    * A friendly cloud app: Dabble, with a Plot Grid and co-authoring
    * Wiki-style world notes and a choice of AI models: Novelcrafter and its Codex
    * The most AI drafting: Sudowrite
    * To turn a finished manuscript into a book: Atticus for a lifetime licence, Vellum for Mac-only polish, or Reedsy Studio as a free browser tool
  method: Each app is checked against its own pages for platforms, price and AI stance, and prices carry the date I checked them. I have used Google Docs, Word, Scrivener, Ulysses and Obsidian for my own writing; the rest are assessed from vendor pages and published reviews.
  runner_ups:
  - Scrivener
  - Dabble
  - Novelcrafter
