disclosure_hub: I'm Ben Luxon, and I make Writing Desk, so it is listed first on every page here. I wrote my own novels in Google Docs, Word, Scrivener, Ulysses and Obsidian, and none of them did everything I needed, which is why I built Writing Desk. Every other app gets the same card, the same checks and a real reason to skip it.
disclosure_category: I make Writing Desk, so it is listed first. Every other app here gets the same card and the same checks, including a reason to skip it.
how_we_chose: An app is here if you can use it to write, plan or edit a book, essay or article. I leave out SEO tools and anything I could not verify. Platforms, prices and AI stance come from each app's own pages, and every price shows the date I checked it. Ratings appear only when a first-party store publishes one, with the source named, and they are never blended. I review prices and verdicts every quarter, and each page shows when it was last updated.
